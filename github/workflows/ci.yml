name: CI

on:
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and run tests
        run: mvn -B verify -Dtest="AppTest#stepsLiquidate"

      - name: upload file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-test
          path: |
            target/surefire-reports/
            target/h2/